<!doctype html>
<html lang="en-AU" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>MKTG1025 Help</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>[hidden] { display: none !important; }</style>
<style>
/* Layout: one centred column. The search bar is the spine. Under it, the most asked buttons, then three doors in student words
   (my report section by section, rules, something has happened). A door opens a list; a list opens one answer or one section page. */
:root {
  --bg: #ffffff;
  --surface: #f4f5f8;
  --surface-2: #e9ecf2;
  --line: #d3d8e1;
  --fg: #1b1d23;
  --muted: #535a67;
  --red: #ba372a;
  --red-ink: #9c2d22;
  --navy: #000054;
  --on-navy: #ffffff;
  --tint: #fbeaea;
  --navy-tint: #eceef8;
  --ok: #16653b;
  --ok-tint: #e2f2e8;
  --focus: #000054;
  --font: "Lato", "Lato Extended", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14151c; --surface: #1c1e28; --surface-2: #262937; --line: #363a4c; --fg: #eceef4; --muted: #aab0be;
    --red: #ff8f80; --red-ink: #ff8f80; --navy: #c5ccff; --on-navy: #14151c; --tint: #3a2523; --navy-tint: #22243a;
    --ok: #7fd8a6; --ok-tint: #173527; --focus: #c5ccff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14151c; --surface: #1c1e28; --surface-2: #262937; --line: #363a4c; --fg: #eceef4; --muted: #aab0be;
  --red: #ff8f80; --red-ink: #ff8f80; --navy: #c5ccff; --on-navy: #14151c; --tint: #3a2523; --navy-tint: #22243a;
  --ok: #7fd8a6; --ok-tint: #173527; --focus: #c5ccff; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.55 var(--font); -webkit-text-size-adjust: 100%; }
.wrap {
  max-width: 760px; margin: 0 auto;
  padding-block: 18px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px;
}
.sr { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--navy); color: var(--on-navy); padding: 8px 14px; border-radius: 8px; z-index: 5; }
.skip:focus { top: 8px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
button { font: inherit; color: inherit; }
a { color: var(--red-ink); }
h2, h3 { text-wrap: balance; }

/* header */
.top { display: grid; gap: 12px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.brand h1 { margin: 0; font-size: 1.45rem; line-height: 1.2; color: var(--navy); letter-spacing: -0.01em; }
.brand h1 .code { color: var(--red); }
.brand p { margin: 0; color: var(--muted); font-size: 0.92rem; }
.searchrow { display: grid; gap: 6px; }
.searchrow label { font-weight: 700; font-size: 1.02rem; }
.field { position: relative; display: flex; }
#q {
  width: 100%; min-width: 0; font: inherit; font-size: 1.12rem; color: var(--fg);
  background: var(--bg); border: 2px solid var(--line); border-radius: var(--radius);
  padding: 13px 88px 13px 14px; -webkit-appearance: none; appearance: none;
}
#q::placeholder { color: var(--muted); opacity: 1; }
#q:placeholder-shown { padding-right: 14px; }
#q:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--navy) 22%, transparent); }
#q::-webkit-search-cancel-button { display: none; }
.clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  border: 0; background: var(--surface-2); border-radius: 8px; padding: 7px 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer;
}

/* home */
main { display: grid; gap: 18px; min-width: 0; }
main:focus { outline: none; }
.label { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1.5px solid var(--red); color: var(--red-ink); background: var(--bg); border-radius: 999px;
  padding: 8px 14px; font-size: 0.95rem; font-weight: 700; cursor: pointer; min-height: 40px;
}
.chip:hover { background: var(--tint); }

.doors { display: grid; gap: 10px; }
.door {
  text-align: left; border: 2px solid var(--line); background: var(--bg); border-radius: var(--radius);
  padding: 15px 17px; cursor: pointer; display: grid; gap: 3px; min-height: 72px;
}
.door:hover { border-color: var(--navy); }
.door b { font-size: 1.12rem; color: var(--navy); line-height: 1.3; }
.door span { color: var(--muted); font-size: 0.93rem; line-height: 1.45; }
.door.report { border-color: var(--navy); background: var(--navy-tint); }
.door.person { background: var(--tint); border-color: transparent; }
.door.person:hover { border-color: var(--red); }

.pick { display: grid; gap: 10px; }
@media (min-width: 600px) { .pick { grid-template-columns: 1fr 1fr; } }
.pick .door { min-height: 88px; }

/* lists */
.status { margin: 0; color: var(--muted); font-size: 0.95rem; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pills .lbl { color: var(--muted); font-size: 0.88rem; margin-right: 2px; }
.pill { border: 1.5px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 0.88rem; cursor: pointer; min-height: 34px; }
.pill[aria-pressed="true"] { background: var(--navy); color: var(--on-navy); border-color: var(--navy); font-weight: 700; }
.grp { margin: 10px 0 0; font-size: 0.95rem; color: var(--navy); }
.grp:first-child { margin-top: 0; }
.grp.big { font-size: 1.15rem; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); }
.grp.sub { margin: 6px 0 0; font-size: 0.9rem; color: var(--muted); font-weight: 700; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.item {
  width: 100%; text-align: left; border: 1.5px solid var(--line); background: var(--bg); border-radius: var(--radius);
  padding: 12px 14px; cursor: pointer; display: grid; gap: 4px;
}
.item:hover { border-color: var(--navy); }
.item .q { font-weight: 700; font-size: 1.02rem; line-height: 1.35; }
.item .first { color: var(--muted); font-size: 0.92rem; line-height: 1.4; }
.item .for { font-size: 0.8rem; color: var(--muted); }
.item.sec { grid-template-columns: auto 1fr; column-gap: 12px; align-items: start; }
.item.sec .num {
  grid-row: 1 / span 2; align-self: start; min-width: 44px; text-align: center; font-weight: 700; font-size: 0.95rem;
  background: var(--navy); color: var(--on-navy); border-radius: 8px; padding: 4px 8px; margin-top: 2px; font-variant-numeric: tabular-nums;
}
.item.sec .num.word { background: var(--surface-2); color: var(--navy); }
.item.sec.first { border-color: var(--navy); background: var(--navy-tint); }
.item.sec.first .num { background: var(--red); }
.item.sec .first { grid-column: 2; }
.more { justify-self: start; }
.tip { margin: 0; color: var(--muted); font-size: 0.95rem; }

/* answer card and section page */
.back { justify-self: start; border: 1.5px solid var(--navy); background: var(--bg); color: var(--navy); font-weight: 700; padding: 8px 16px; border-radius: 8px; cursor: pointer; min-height: 40px; }
.back:hover { background: var(--navy-tint); }
.card { display: grid; gap: 14px; }
.card h2 { margin: 0; font-size: 1.32rem; line-height: 1.3; }
.card h2:focus { outline: none; }
.crumb { margin: 0; font-size: 0.85rem; color: var(--muted); }
.answer { margin: 0; background: var(--tint); border-radius: var(--radius); padding: 15px 17px; font-size: 1.16rem; font-weight: 700; line-height: 1.45; }
.answer.person { background: var(--surface-2); }
.details { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.details li { padding-left: 2px; }
.decide { background: var(--navy-tint); border-left: 5px solid var(--navy); border-radius: 6px var(--radius) var(--radius) 6px; padding: 12px 16px; display: grid; gap: 2px; }
.decide .lbl { font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--navy); }
.decide p { margin: 0; font-size: 1.14rem; font-weight: 700; line-height: 1.4; }
.block { display: grid; gap: 8px; }
.block h3 { margin: 0; font-size: 1.02rem; }
.block ul { margin: 0; padding-left: 1.2em; display: grid; gap: 5px; }
.block.start { background: var(--surface); border-radius: var(--radius); padding: 12px 16px; }
.block.start h3 { font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.block.table { border-left: 5px solid var(--red); padding-left: 14px; }
.block.table p { margin: 0; }
.expect { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }
.expect li { padding-left: 4px; }
.block.watch { background: var(--tint); border-radius: var(--radius); padding: 12px 16px; }
.block.watch h3 { color: var(--red-ink); }
.block.goes { border-top: 1px solid var(--line); padding-top: 12px; }
.block.goes p { margin: 0; }
.taught { margin: 0; color: var(--muted); font-size: 0.92rem; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checks label {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; cursor: pointer;
  border: 1.5px solid var(--line); border-radius: var(--radius); padding: 11px 13px; background: var(--bg);
}
.checks input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--ok); }
.checks input:checked + span { color: var(--muted); }
.checks label:has(input:checked) { border-color: var(--ok); background: var(--ok-tint); }
.progress { margin: 0; font-weight: 700; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
.done { margin: 0; background: var(--ok-tint); color: var(--ok); border-radius: var(--radius); padding: 11px 14px; font-weight: 700; }
.next { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
.next h3 { margin: 0; font-size: 1rem; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { border: 1.5px solid var(--navy); background: var(--bg); color: var(--navy); border-radius: 8px; padding: 9px 14px; font-weight: 700; cursor: pointer; text-align: left; min-height: 44px; }
.opt:hover { background: var(--surface); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; justify-self: start;
  background: var(--navy); color: var(--on-navy); border: 0; border-radius: 8px; padding: 11px 18px;
  font-weight: 700; font-size: 1rem; cursor: pointer; text-decoration: none; min-height: 44px;
}
.btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--navy); }
.find { margin: 0; color: var(--muted); }
.find b { color: var(--fg); }
.pn { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (min-width: 600px) { .pn { grid-template-columns: 1fr 1fr; } }
.pn .opt { display: grid; gap: 2px; }
.pn .opt small { font-weight: 400; color: var(--muted); font-size: 0.82rem; }
.pn .opt.n { text-align: right; }
.linkbtn { border: 0; background: none; color: var(--red-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px 0; font-size: 0.92rem; }

/* footer */
.foot { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 4px; }
.foot p { margin: 0; }
.foot .still { font-weight: 700; }
.foot .src { color: var(--muted); font-size: 0.88rem; }
.err { background: var(--tint); border-radius: var(--radius); padding: 14px 16px; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><span class="code">MKTG1025</span> Help</h1>
      <p>Help from your teaching team</p>
    </div>
    <form class="searchrow" role="search" id="searchform" autocomplete="off">
      <label for="q">What do you need?</label>
      <div class="field">
        <input id="q" name="q" type="search" placeholder="Type a word, like persona or group" enterkeyhint="search" aria-describedby="qhint">
        <button type="button" class="clear" id="clear" hidden>Clear</button>
      </div>
      <span id="qhint" class="sr">Results appear as you type. Press Enter to open the top result.</span>
    </form>
  </header>

  <main id="main" tabindex="-1">
    <p class="status">Loading...</p>
  </main>

  <p id="live" class="sr" aria-live="polite"></p>

  <footer class="foot">
    <p class="still">Still stuck? Ask your tutor in class or by email.</p>
    <p class="src">Everything here comes from the MKTG1025 assessment pages and your teaching team.</p>
  </footer>
</div>

<script>
/* MKTG1025 Help: data and search. No dependencies. Shared by the page and the test harness. */
(function (root) {
  'use strict';

  var STOP = new Set(('a an the i im ive id me my mine we our us you your is are am was were be been being ' +
    'do does did to of for in on at by and or it its this that these those what whats how hows when ' +
    'where wheres which who why can could should would will shall if so about with from get got have has had ' +
    'there any please just really still also then than into out up as but not no yes ok okay hi hello thanks').split(' '));

  function parseCSV(text) {
    if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
    var rows = [], row = [], field = '', inQ = false;
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (inQ) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else { inQ = false; } }
        else field += c;
        continue;
      }
      if (c === '"') inQ = true;
      else if (c === ',') { row.push(field); field = ''; }
      else if (c === '\r') { /* ignore */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
    if (field !== '' || row.length) { row.push(field); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (f) { return f.trim() !== ''; }); });
  }

  function toObjects(rows) {
    if (!rows.length) return [];
    var head = rows[0].map(function (h) { return h.trim().toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, ''); });
    return rows.slice(1).map(function (r) {
      var o = {};
      head.forEach(function (h, j) { o[h] = (r[j] || '').trim(); });
      return o;
    });
  }

  function lines(s) {
    return String(s || '').split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
  }

  var KEEP = new Set(['canvas']);
  function stem(w) {
    if (KEEP.has(w)) return w;
    if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y';
    if (w.length > 5 && /ing$/.test(w)) return w.slice(0, -3);
    if (w.length > 4 && /ed$/.test(w)) return w.slice(0, -2);
    if (w.length > 3 && /s$/.test(w) && !/ss$/.test(w)) return w.slice(0, -1);
    return w;
  }

  function tokens(s) {
    var t = String(s || '').toLowerCase()
      .replace(/[‘’']/g, '')
      .replace(/(\d)\.(\d)/g, '$1_$2')
      .replace(/[^a-z0-9_]+/g, ' ')
      .split(' ');
    var out = [];
    for (var i = 0; i < t.length; i++) {
      var w = t[i];
      if (!w || STOP.has(w)) continue;
      if (w.length === 1 && !/\d/.test(w)) continue;
      out.push(stem(w));
    }
    return out;
  }

  function raw(s) {
    return String(s || '').toLowerCase().replace(/[‘’']/g, '').replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();
  }

  function lev(a, b, max) {
    /* edit distance where swapping two neighbouring letters counts as one edit */
    if (Math.abs(a.length - b.length) > max) return max + 1;
    var prev2 = null, prev = new Array(b.length + 1), cur = new Array(b.length + 1);
    for (var j = 0; j <= b.length; j++) prev[j] = j;
    for (var i = 1; i <= a.length; i++) {
      cur[0] = i; var rowMin = i;
      for (var k = 1; k <= b.length; k++) {
        var cost = a[i - 1] === b[k - 1] ? 0 : 1;
        cur[k] = Math.min(prev[k] + 1, cur[k - 1] + 1, prev[k - 1] + cost);
        if (prev2 && i > 1 && k > 1 && a[i - 1] === b[k - 2] && a[i - 2] === b[k - 1]) cur[k] = Math.min(cur[k], prev2[k - 2] + 1);
        if (cur[k] < rowMin) rowMin = cur[k];
      }
      if (rowMin > max) return max + 1;
      prev2 = prev; prev = cur; cur = new Array(b.length + 1);
    }
    return prev[b.length];
  }

  function matchQuality(q, set) {
    if (set.has(q)) return 1;
    var best = 0;
    set.forEach(function (t) {
      if (best >= 0.8) return;
      if (q.length >= 3 && t.indexOf(q) === 0) { best = Math.max(best, 0.8); return; }
      if (t.length >= 4 && q.indexOf(t) === 0) { best = Math.max(best, 0.75); return; }
      if (q.length >= 5 && t.length >= 5 && Math.abs(q.length - t.length) <= 2) {
        var d = lev(q, t, q.length >= 8 ? 2 : 1);
        if (d === 1) best = Math.max(best, 0.6);
        else if (d === 2 && q.length >= 8) best = Math.max(best, 0.5);
      }
    });
    return best;
  }

  var FIELDS = [['words', 4], ['question', 3], ['answer', 2], ['body', 1]];

  function index(e, words, question, answer, body) {
    e._idx = {
      words: new Set(tokens(words)),
      question: new Set(tokens(question)),
      answer: new Set(tokens(answer)),
      body: new Set(tokens(body))
    };
    e._qnorm = ' ' + tokens(question).join(' ') + ' ';
    e._phrases = String(words).split(/,|\r?\n/).map(raw).filter(function (p) { return p.indexOf(' ') > 0; });
    e._hasA = /^Assessment/.test(e.assessment);
  }

  function prepare(rawAnswers, rawLinks, rawSections) {
    var links = {};
    (rawLinks || []).forEach(function (l) { if (l.key) links[l.key.trim()] = { label: l.label || l.key, url: (l.url || '').trim() }; });
    var answers = (rawAnswers || []).filter(function (a) { return a.id && a.question; }).map(function (a) {
      var details = lines(a.details);
      var checks = lines(a.checks);
      var opts = String(a.next_options || '').split(/;|\r?\n/).map(function (p) {
        var k = p.lastIndexOf('=');
        if (k < 0) return null;
        var label = p.slice(0, k).trim(), id = p.slice(k + 1).trim();
        return label && id ? { label: label, id: id } : null;
      }).filter(Boolean);
      var e = {
        kind: 'answer', id: a.id.trim(), assessment: (a.assessment || 'General').trim(), topic: (a.topic || '').trim(),
        question: a.question, answer: a.answer || '', details: details, checks: checks,
        link: (a.link || '').trim(), nextQuestion: a.next_question || '', nextOptions: opts,
        quick: (a.quick_button || '').trim(), words: a.search_words || ''
      };
      index(e, e.words, e.question, e.answer, details.concat(checks).join(' '));
      return e;
    });
    var sections = (rawSections || []).filter(function (s) { return s.id && s.title; }).map(function (s) {
      var number = (s.number || '').trim();
      var numbered = number && !/^[A-Za-z]/.test(number);
      var e = {
        kind: 'section', id: s.id.trim(), assessment: (s.assessment || '').trim(), group: s.group || '', number: number, numbered: numbered,
        title: s.title, question: (numbered ? number + ' ' : '') + s.title, decides: s.decides || '', answer: s.decides || '',
        start: lines(s.start_with), steps: lines(s.do_this), table: s.table_and_writing || '', watch: lines(s.watch_out),
        next: s.goes_next || '', taught: s.taught_in || '', link: (s.link || '').trim(), words: s.search_words || ''
      };
      index(e, e.words + ', section by section, what to do, how to do', e.question, e.decides, e.start.concat(e.steps, e.watch).join(' ') + ' ' + e.table + ' ' + e.next);
      return e;
    });
    var entries = answers.concat(sections);
    var byId = {};
    entries.forEach(function (e) { byId[e.id.toUpperCase()] = e; });
    var sectionsOf = {};
    sections.forEach(function (s) { (sectionsOf[s.assessment] = sectionsOf[s.assessment] || []).push(s); });
    return { entries: entries, answers: answers, sections: sections, sectionsOf: sectionsOf, byId: byId, links: links };
  }

  function idFromQuery(q) {
    var s = String(q).trim().toUpperCase().replace(/\s+/g, '');
    var m = s.match(/^(GEN|A[1-3])-?S-?(\d{1,2})$/);
    if (m) return m[1] + '-S' + (m[2].length === 1 ? '0' + m[2] : m[2]);
    m = s.match(/^(GEN|A[1-3])-?(\d{1,2})$/);
    if (!m) return null;
    return m[1] + '-' + (m[2].length === 1 ? '0' + m[2] : m[2]);
  }

  function inScope(e, filter) {
    return !filter || filter === 'all' || e.assessment === 'General' || e.assessment === filter;
  }

    if (!h) return false;
    var low = h.toLowerCase();
    if (low === 'a1' || low === 'a2' || low === 'a3') { state.view = 'sections'; state.assessment = 'Assessment ' + low.slice(1); render(false); return true; }
    if (DOORS[low]) { state.view = 'door'; state.door = low; render(false); return true; }
    var id = C.idFromQuery(h);
    if (id && db.byId[id]) { state.view = db.byId[id].kind === 'section' ? 'section' : 'answer'; state.id = id; render(false); return true; }
    return false;
  }
  window.addEventListener('hashchange', function () { if (db) route(); });

  /* ---------- load ---------- */
  function get(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(url + ' ' + r.status); return r.text(); });
  }
  function embedded(id) { var n = document.getElementById(id); return n ? Promise.resolve(n.textContent) : null; }
  var inline = embedded('data-answers');
  Promise.all(inline ? [inline, embedded('data-links') || Promise.resolve('Key,Label,URL\n'), embedded('data-sections') || Promise.resolve('ID\n')] : [
    get(CONFIG.ANSWERS),
    get(CONFIG.LINKS).catch(function () { return 'Key,Label,URL\n'; }),
    get(CONFIG.SECTIONS).catch(function () { return 'ID\n'; })
  ])
    .then(function (texts) {
      db = C.prepare(C.toObjects(C.parseCSV(texts[0])), C.toObjects(C.parseCSV(texts[1])), C.toObjects(C.parseCSV(texts[2])));
      if (!route()) render(false);
    })
    .catch(function (err) {
      main.innerHTML = '';
      main.appendChild(el('div', { class: 'err' }, [
        el('p', { style: 'margin:0 0 6px;font-weight:700', text: 'The page did not load.' }),
        el('p', { style: 'margin:0', text: 'Refresh the page. If it keeps happening, ask your tutor.' })
      ]));
      if (window.console) console.warn('MKTG1025 Help: could not load data. Open the page through a web address, not by double-clicking the file.', err);
    });
})();
</script>
